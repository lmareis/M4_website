website:
  title: "Your Name"
  description: "I am a NUMBER year PhD student at the chair of Mathematical Statistics at the Technical University of Munich (TUM), under the supervision of Prof. Mathias Drton."
  open-graph:
    title: "Your Name"
    description: "I am a NUMBER year PhD student at the chair of Mathematical Statistics at the Technical University of Munich (TUM), under the supervision of Prof. Mathias Drton."
    image: images/Mareis_picture_4.jpeg
  site-url: "https://your_website_url.de" #"https://lmareis.github.io"
  favicon: images/favicon.png
  search:
    location: navbar
    type: overlay
  back-to-top-navigation: false
  navbar:
    right:
      - text: "Research"
        href: pages/research.qmd
      - text: "Talks and Presentations"
        href: pages/presentations.qmd
      - text: "Teaching"
        href: pages/teaching.qmd
      - text: "CV"
        href: content/cv/cv.pdf
